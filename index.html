<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>نمایش سه‌بعدی ریشه‌های مختلط</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Tahoma, sans-serif; background-color: #111; }
        #info {
            position: absolute; top: 10px; left: 10px; color: white;
            background: rgba(0,0,0,0.8); padding: 12px; border-radius: 8px;
            pointer-events: none; max-width: 220px; direction: rtl; border-right: 3px solid #f0ad4e;
            font-size: 0.8em; line-height: 1.6; z-index: 100;
        }
        #info h1 { margin: 0 0 5px 0; font-size: 1em; color: #f0ad4e; }
        #status {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0,0,0,0.8); color: #5cb85c;
            padding: 8px 12px; border-radius: 8px; font-size: 0.8em; direction: rtl; z-index: 100;
        }
        #controls {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.85); padding: 8px 15px; border-radius: 25px;
            display: flex; gap: 10px; color: white; font-size: 0.75em;
            border: 1px solid #444; flex-wrap: wrap; justify-content: center; z-index: 100;
        }
        #controls label { display: flex; align-items: center; gap: 5px; }
        #controls input { width: 60px; }
    </style>
</head>
<body>
    <div id="info">
        <h1>ریشه‌های مختلط</h1>
        <p>با انگشت بچرخانید</p>
        <p style="color:#0056b3;">■ سهمی (کج شده)</p>
        <p style="color:#d9534f;">■ ریشه‌های حقیقی</p>
        <p style="color:#f0ad4e;">■ ریشه‌های مختلط (شناور در بعد Z)</p>
        <p style="color:#5cb85c;">■ محور تقارن</p>
    </div>
    
    <div id="status">Δ مثبت: ریشه‌ها حقیقی</div>

    <div id="controls">
        <label>a: <input type="range" id="a" min="-2" max="2" step="0.1" value="1"></label>
        <label>b: <input type="range" id="b" min="-10" max="10" step="0.5" value="2"></label>
        <label>c: <input type="range" id="c" min="-10" max="10" step="0.5" value="5"></label>
    </div>

    <!-- بارگذاری Three.js و OrbitControls از CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. تنظیمات صحنه
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, 12, 15); // زاویه دید سه‌بعدی
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // 2. کنترل چرخش (مخصوص موبایل و دسکتاپ)
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.target.set(0, 0, 0);

        // 3. نورپردازی
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // 4. محورها (X حقیقی، Y حقیقی، Z موهومی)
        function createAxis(start, end, color) {
            const material = new THREE.LineBasicMaterial({ color: color, linewidth: 2 });
            const points = [new THREE.Vector3(...start), new THREE.Vector3(...end)];
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            return new THREE.Line(geometry, material);
        }
        scene.add(createAxis([-10, 0, 0], [10, 0, 0], 0xff4444)); // محور X (حقیقی)
        scene.add(createAxis([0, -10, 0], [0, 10, 0], 0x44ff44)); // محور Y (مقدار تابع)
        scene.add(createAxis([0, 0, -10], [0, 0, 10], 0x4444ff)); // محور Z (موهومی)

        // برچسب محورها
        function createLabel(text, position, color) {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = color;
            ctx.font = 'bold 30px Tahoma';
            ctx.textAlign = 'center';
            ctx.fillText(text, 64, 45);
            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.SpriteMaterial({ map: texture });
            const sprite = new THREE.Sprite(material);
            sprite.position.set(...position);
            sprite.scale.set(2, 1, 1);
            return sprite;
        }
        scene.add(createLabel('X', [10, 0.5, 0], '#ff4444'));
        scene.add(createLabel('Y', [0, 10, 0], '#44ff44'));
        scene.add(createLabel('Z (موهومی)', [0, 0.5, 10], '#4444ff'));

        // 5. صفحه کج شده برای نمایش سهمی (برای حس سه‌بعدی بهتر)
        // ما سهمی را در صفحه X-Y رسم می‌کنیم، اما آن را 30 درجه حول محور X می‌چرخانیم
        // تا بعد Z نیز در دید قرار گیرد.
        const parabolaGroup = new THREE.Group();
        parabolaGroup.rotation.x = -Math.PI / 6; // کج کردن 30 درجه
        scene.add(parabolaGroup);

        // 6. عناصر داینامیک
        let parabolaMesh = null;
        let axisLine = null;
        let rootSpheres = [];
        let complexLine = null;
        let dashLine = null;

        function clearScene() {
            if (parabolaMesh) { parabolaGroup.remove(parabolaMesh); parabolaMesh.geometry.dispose(); parabolaMesh.material.dispose(); }
            if (axisLine) { parabolaGroup.remove(axisLine); axisLine.geometry.dispose(); axisLine.material.dispose(); }
            if (complexLine) { scene.remove(complexLine); complexLine.geometry.dispose(); complexLine.material.dispose(); }
            if (dashLine) { scene.remove(dashLine); dashLine.geometry.dispose(); dashLine.material.dispose(); }
            rootSpheres.forEach(s => { scene.remove(s); s.geometry.dispose(); s.material.dispose(); });
            rootSpheres = [];
        }

        function updateScene() {
            const a = parseFloat(document.getElementById('a').value);
            const b = parseFloat(document.getElementById('b').value);
            const c = parseFloat(document.getElementById('c').value);
            const delta = b * b - 4 * a * c;
            const statusDiv = document.getElementById('status');

            clearScene();

            // الف) رسم سهمی در گروه کج شده
            const points = [];
            for (let x = -6; x <= 6; x += 0.1) {
                const y = a * x * x + b * x + c;
                points.push(new THREE.Vector3(x, y, 0));
            }
            const curve = new THREE.CatmullRomCurve3(points);
            const tubeGeo = new THREE.TubeGeometry(curve, 100, 0.15, 8, false);
            const tubeMat = new THREE.MeshPhongMaterial({ color: 0x0056b3, emissive: 0x001122, shininess: 50 });
            parabolaMesh = new THREE.Mesh(tubeGeo, tubeMat);
            parabolaGroup.add(parabolaMesh);

            // ب) رسم محور تقارن (در همان گروه کج شده)
            const axisX = -b / (2 * a);
            const axisPoints = [new THREE.Vector3(axisX, -10, 0), new THREE.Vector3(axisX, 15, 0)];
            const axisGeo = new THREE.BufferGeometry().setFromPoints(axisPoints);
            const axisMat = new THREE.LineDashedMaterial({ color: 0x5cb85c, dashSize: 0.8, gapSize: 0.5 });
            axisLine = new THREE.Line(axisGeo, axisMat);
            axisLine.computeLineDistances();
            parabolaGroup.add(axisLine);

            // ج) رسم ریشه‌ها
            if (delta >= 0) {
                // ریشه‌های حقیقی: روی محور X (در گروه کج شده)
                statusDiv.textContent = `Δ = ${delta.toFixed(2)} (مثبت) → ریشه‌ها حقیقی`;
                statusDiv.style.color = '#5cb85c';

                const r1 = (-b + Math.sqrt(delta)) / (2 * a);
                const r2 = (-b - Math.sqrt(delta)) / (2 * a);

                [r1, r2].forEach(r => {
                    const sphereGeo = new THREE.SphereGeometry(0.3, 32, 32);
                    const sphereMat = new THREE.MeshPhongMaterial({ color: 0xd9534f, emissive: 0x441111 });
                    const sphere = new THREE.Mesh(sphereGeo, sphereMat);
                    sphere.position.set(r, 0, 0);
                    parabolaGroup.add(sphere); // داخل گروه کج شده
                    rootSpheres.push(sphere);
                });

            } else {
                // ریشه‌های مختلط: در فضای سه‌بعدی شناور می‌شوند
                statusDiv.textContent = `Δ = ${delta.toFixed(2)} (منفی) → ریشه‌ها مختلط`;
                statusDiv.style.color = '#f0ad4e';

                const realPart = -b / (2 * a);
                const imagPart = Math.sqrt(-delta) / (2 * a);

                // ریشه اول (در بعد Z مثبت)
                const sphereGeo1 = new THREE.SphereGeometry(0.4, 32, 32);
                const sphereMat1 = new THREE.MeshPhongMaterial({ color: 0xf0ad4e, emissive: 0x442200 });
                const sphere1 = new THREE.Mesh(sphereGeo1, sphereMat1);
                sphere1.position.set(realPart, 0, imagPart); // در فضای اصلی (نه کج شده)
                scene.add(sphere1);
                rootSpheres.push(sphere1);

                // ریشه دوم (در بعد Z منفی)
                const sphereGeo2 = new THREE.SphereGeometry(0.4, 32, 32);
                const sphereMat2 = new THREE.MeshPhongMaterial({ color: 0xf0ad4e, emissive: 0x442200 });
                const sphere2 = new THREE.Mesh(sphereGeo2, sphereMat2);
                sphere2.position.set(realPart, 0, -imagPart); // در فضای اصلی
                scene.add(sphere2);
                rootSpheres.push(sphere2);

                // خط اتصال بین دو ریشه مختلط
                const linePoints = [
                    new THREE.Vector3(realPart, 0, imagPart),
                    new THREE.Vector3(realPart, 0, -imagPart)
                ];
                const lineGeo = new THREE.BufferGeometry().setFromPoints(linePoints);
                const lineMat = new THREE.LineBasicMaterial({ color: 0xf0ad4e });
                complexLine = new THREE.Line(lineGeo, lineMat);
                scene.add(complexLine);

                // خط‌چین از ریشه به محور تقارن (برای نشان دادن ارتباط)
                const dashPoints = [
                    new THREE.Vector3(realPart, 0, imagPart),
                    new THREE.Vector3(realPart, 0, 0)
                ];
                const dashGeo = new THREE.BufferGeometry().setFromPoints(dashPoints);
                const dashMat = new THREE.LineDashedMaterial({ color: 0xf0ad4e, dashSize: 0.4, gapSize: 0.3 });
                dashLine = new THREE.Line(dashGeo, dashMat);
                dashLine.computeLineDistances();
                scene.add(dashLine);
            }
        }

        // رویدادها
        document.getElementById('a').addEventListener('input', updateScene);
        document.getElementById('b').addEventListener('input', updateScene);
        document.getElementById('c').addEventListener('input', updateScene);

        // حلقه رندر
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        updateScene();
        animate();
    </script>
</body>
</html>
